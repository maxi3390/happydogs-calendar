services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nursery
      POSTGRES_USER: nursery
      POSTGRES_PASSWORD: nursery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nursery -d nursery"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy

  backend:
    build: ./backend
    environment:
      - DEBUG=True
      - POSTGRES_DB=nursery
      - POSTGRES_USER=nursery
      - POSTGRES_PASSWORD=nursery
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      traefik:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    labels:
      - traefik.enable=true
      - traefik.http.services.api.loadbalancer.server.port=8000

      # Router: matches /api/ and everything beneath it
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true

      # Router: serve /media/ directly from Django
      - traefik.http.routers.media.rule=Host(`${DOMAIN}`) && PathPrefix(`/media`)
      - traefik.http.routers.media.entrypoints=websecure
      - traefik.http.routers.media.tls=true
      - traefik.http.routers.media.service=api
      # Uncomment the line below to use Let's Encrypt instead of self-signed:
      # - traefik.http.routers.api.tls.certresolver=letsencrypt
    networks:
      - proxy

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      traefik:
        condition: service_started
      backend:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.services.frontend.loadbalancer.server.port=3000

      # Router: catch-all (lowest priority — api router wins for /api/*)
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      # Uncomment the line below to use Let's Encrypt instead of self-signed:
      # - traefik.http.routers.frontend.tls.certresolver=letsencrypt
    networks:
      - proxy

  docs:
    build: ./docs
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    profiles:
      - docs

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — grants Traefik read-only, scoped access to the
  # Docker API without exposing the raw socket directly to Traefik.
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      # Read-only endpoints Traefik needs — everything else is denied (0)
      CONTAINERS: 1
      SERVICES:   1
      NETWORKS:   1
      TASKS:      1
      EVENTS:     1
      PING:       1
      VERSION:    1
      INFO:       1
      # Explicitly block write-access endpoints
      POST:       0
      AUTH:       0
      SECRETS:    0
      BUILD:      0
      COMMIT:     0
      CONFIGS:    0
      DISTRIBUTION: 0
      EXEC:       0
      GRPC:       0
      IMAGES:     0
      NODES:      0
      PLUGINS:    0
      SESSION:    0
      SWARM:      0
      SYSTEM:     0
      VOLUMES:    0
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}   # Cloudflare API token (for Let's Encrypt DNS challenge)
    volumes:
      - traefik-certs:/certs                   # Persistent storage for Let's Encrypt certificates
    command:
      # --- API / Dashboard (disabled in production) ---
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.traefik.address=:8080

      # --- Docker provider (via socket proxy — no direct socket mount) ---
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false

      # --- Entrypoints ---
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Redirect all HTTP → HTTPS globally
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      # --- TLS: self-signed fallback (used when no ACME cert is available) ---
      - --entrypoints.websecure.http.tls=true

      # --- ACME / Let's Encrypt via Cloudflare DNS challenge ---
      # To activate: set CF_DNS_API_TOKEN and switch caServer to the production URL.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
      # Staging CA — swap for production once validated:
      #   https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}

      # --- Logs ---
      - --log.level=INFO
    networks:
      - socket-proxy
      - proxy

volumes:
  # External named volume: declared outside this compose project so that
  # `docker compose down -v` — and therefore `make clean` — cannot remove
  # it. The volume is auto-created by `make up` / `make init` / etc. via
  # the `volume-ensure` Makefile target. To remove it intentionally, run
  # `make destroy-db` (confirmation-gated).
  postgres_data:
    external: true
    name: happy-calendar_postgres_data
  traefik-certs:

networks:
  # Internal network — only docker-socket-proxy and traefik, never exposed to apps
  socket-proxy:
    driver: bridge
    internal: true   # no outbound internet access from this network
  proxy:
    driver: bridge