services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Dev defaults match the historical hardcoded values, so a fresh
      # checkout still works with no ``.env``. Production deployments
      # MUST override ``POSTGRES_PASSWORD`` (and usually the db name +
      # user too) via ``.env``; the default password is committed and
      # therefore public.
      POSTGRES_DB: ${POSTGRES_DB:-nursery}
      POSTGRES_USER: ${POSTGRES_USER:-nursery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nursery}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nursery} -d ${POSTGRES_DB:-nursery}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Dev defaults so a fresh checkout boots with no ``.env``.
      # Production deployments MUST override ``DJANGO_SECRET_KEY`` and
      # ``POSTGRES_PASSWORD`` via ``.env`` — the committed values are
      # public. ``DEBUG`` defaults to True for local dev; flip via
      # ``.env`` for any internet-facing deployment.
      - DEBUG=${DEBUG:-True}
      - POSTGRES_DB=${POSTGRES_DB:-nursery}
      - POSTGRES_USER=${POSTGRES_USER:-nursery}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nursery}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      # File-storage backend selection. All four S3_* vars unset =>
      # FileSystemStorage (today's behaviour). All four set => the
      # backend talks to whatever S3-compatible bucket the operator
      # provided (Garage / MinIO / AWS / …). See
      # ``openspec/specs/backend/file-storage/spec.md``.
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION_NAME=${S3_REGION_NAME:-garage}
      - S3_ADDRESSING_STYLE=${S3_ADDRESSING_STYLE:-path}
      - S3_QUERYSTRING_AUTH=${S3_QUERYSTRING_AUTH:-False}
    depends_on:
      traefik:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    labels:
      - traefik.enable=true
      - traefik.http.services.api.loadbalancer.server.port=8000

      # Router: matches /api/ and everything beneath it
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true

      # Router: serve /media/ directly from Django
      - traefik.http.routers.media.rule=Host(`${DOMAIN}`) && PathPrefix(`/media`)
      - traefik.http.routers.media.entrypoints=websecure
      - traefik.http.routers.media.tls=true
      - traefik.http.routers.media.service=api
      # Uncomment the line below to use Let's Encrypt instead of self-signed:
      # - traefik.http.routers.api.tls.certresolver=letsencrypt
    networks:
      - proxy

  notification-cron:
    # Long-running scheduler for the daily notifications run. Polls the
    # nursery's configured run-time once per minute and fires the
    # ``generate_notifications`` management command. Shares the backend
    # image so all Django app code, models, and translations are
    # available; runs against the same database.
    build: ./backend
    restart: unless-stopped
    environment:
      # Same defaults as the ``backend`` service above; both run the
      # same Django app and need to agree on db creds + secret key.
      - DEBUG=${DEBUG:-True}
      - POSTGRES_DB=${POSTGRES_DB:-nursery}
      - POSTGRES_USER=${POSTGRES_USER:-nursery}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nursery}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - EMAIL_PORT=${EMAIL_PORT:-25}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-happy-calendar@localhost}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python manage.py run_notification_scheduler
    networks:
      - proxy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      traefik:
        condition: service_started
      backend:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.services.frontend.loadbalancer.server.port=3000

      # Router: catch-all (lowest priority — api router wins for /api/*)
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      # Uncomment the line below to use Let's Encrypt instead of self-signed:
      # - traefik.http.routers.frontend.tls.certresolver=letsencrypt
    networks:
      - proxy

  docs:
    build: ./docs
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    profiles:
      - docs

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - proxy
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — grants Traefik read-only, scoped access to the
  # Docker API without exposing the raw socket directly to Traefik.
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      # Read-only endpoints Traefik needs — everything else is denied (0)
      CONTAINERS: 1
      SERVICES:   1
      NETWORKS:   1
      TASKS:      1
      EVENTS:     1
      PING:       1
      VERSION:    1
      INFO:       1
      # Explicitly block write-access endpoints
      POST:       0
      AUTH:       0
      SECRETS:    0
      BUILD:      0
      COMMIT:     0
      CONFIGS:    0
      DISTRIBUTION: 0
      EXEC:       0
      GRPC:       0
      IMAGES:     0
      NODES:      0
      PLUGINS:    0
      SESSION:    0
      SWARM:      0
      SYSTEM:     0
      VOLUMES:    0
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}   # Cloudflare API token (for Let's Encrypt DNS challenge)
    volumes:
      - traefik-certs:/certs                   # Persistent storage for Let's Encrypt certificates
    command:
      # --- API / Dashboard (disabled in production) ---
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.traefik.address=:8080

      # --- Docker provider (via socket proxy — no direct socket mount) ---
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false

      # --- Entrypoints ---
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Redirect all HTTP → HTTPS globally
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      # --- TLS: self-signed fallback (used when no ACME cert is available) ---
      - --entrypoints.websecure.http.tls=true

      # --- ACME / Let's Encrypt via Cloudflare DNS challenge ---
      # To activate: set CF_DNS_API_TOKEN and switch caServer to the production URL.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
      # Staging CA — swap for production once validated:
      #   https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}

      # --- Logs ---
      - --log.level=INFO
    networks:
      - socket-proxy
      - proxy

  # ---------------------------------------------------------------------------
  # Garage — single-node S3-compatible object storage. Profile-gated so
  # ``docker compose up -d`` (no profile) leaves it dormant. Operators
  # opt in with ``docker compose --profile s3 up -d``, then run
  # ``make s3-init`` to create the bucket and access key. The backend
  # discovers Garage via ``S3_ENDPOINT_URL=http://garage:3900`` set on
  # the operator's ``.env``.
  #
  # Spec: ``openspec/specs/tooling/object-storage/spec.md``.
  # ---------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      # Bootstrap-time secrets pulled from the operator's ``.env``.
      # Both default to a dev-friendly (empty) value so a misconfigured
      # ``.env`` is loud rather than insecure: Garage refuses to start
      # without an RPC secret.
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:-}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN:-}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      # Garage exposes a minimal health endpoint on the admin port; ``wget``
      # is part of the Alpine-based base image.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3903/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # Traefik routing is OFF unless the operator opts in via
      # ``S3_TRAEFIK_ENABLED=true``. The labels stay committed so flipping
      # the flag is the only step needed; while the flag is off the
      # ``traefik.enable=false`` line wins and Traefik ignores the rest.
      - traefik.enable=${S3_TRAEFIK_ENABLED:-false}
      - traefik.http.services.garage.loadbalancer.server.port=3900
      - traefik.http.routers.garage.rule=Host(`s3.${DOMAIN:-localhost}`)
      - traefik.http.routers.garage.entrypoints=websecure
      - traefik.http.routers.garage.tls=true
      # Uncomment to use Let's Encrypt instead of self-signed:
      # - traefik.http.routers.garage.tls.certresolver=letsencrypt
    networks:
      - proxy
    profiles:
      - s3

volumes:
  # External named volume: declared outside this compose project so that
  # `docker compose down -v` — and therefore `make clean` — cannot remove
  # it. The volume is auto-created by `make up` / `make init` / etc. via
  # the `volume-ensure` Makefile target. To remove it intentionally, run
  # `make destroy-db` (confirmation-gated).
  postgres_data:
    external: true
    name: happy-calendar_postgres_data
  # Garage volumes follow the same external-volume convention so
  # ``make clean`` cannot delete the bucket data. Created idempotently
  # by ``make volume-ensure-s3``.
  garage_meta:
    external: true
    name: happy-calendar_garage_meta
  garage_data:
    external: true
    name: happy-calendar_garage_data
  traefik-certs:

networks:
  # Internal network — only docker-socket-proxy and traefik, never exposed to apps
  socket-proxy:
    driver: bridge
    internal: true   # no outbound internet access from this network
  proxy:
    driver: bridge